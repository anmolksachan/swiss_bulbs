<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>

    <!-- Title glow gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f9c74f"/>
      <stop offset="40%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f9c74f"/>
    </linearGradient>

    <!-- Scan line gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0"/>
    </linearGradient>

    <!-- Bulb glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f9c74f;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#f9c74f;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#f9c74f;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#f9c74f;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="borderGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f9c74f;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#f9c74f;stop-opacity:0.4"/>
      <stop offset="70%" style="stop-color:#f9c74f;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#f9c74f;stop-opacity:0"/>
    </linearGradient>

    <!-- Clip path -->
    <clipPath id="bannerClip">
      <rect x="1" y="1" width="858" height="218" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="860" height="220" rx="13" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g clip-path="url(#bannerClip)" opacity="0.04">
    <line x1="0" y1="40" x2="860" y2="40" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="860" y2="80" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="860" y2="120" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="860" y2="160" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="860" y2="200" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="220" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="220" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="220" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="220" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="220" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="220" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="220" stroke="#00ff88" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="220" stroke="#00ff88" stroke-width="0.5"/>
  </g>

  <!-- Animated scan line -->
  <g clip-path="url(#bannerClip)">
    <rect x="0" y="0" width="860" height="3" fill="url(#scanGrad)" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" from="0,0" to="0,220" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ── Bulb icons row ── -->
  <!-- WiZ bulb (yellow) -->
  <g transform="translate(68, 110)" filter="url(#glow)">
    <!-- bulb shape -->
    <ellipse cx="0" cy="-12" rx="11" ry="13" fill="#f9c74f" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.1s" begin="0s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="-12" rx="7" ry="9" fill="#f9c74f">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.1s" begin="0s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-4" y="-2" width="8" height="3" rx="1" fill="#f9c74f" opacity="0.9"/>
    <rect x="-3" y="2" width="6" height="2" rx="1" fill="#888" opacity="0.8"/>
    <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="#f9c74f" opacity="0.9">WiZ</text>
  </g>

  <!-- Yeelight bulb (magenta) -->
  <g transform="translate(138, 110)" filter="url(#glow)">
    <ellipse cx="0" cy="-12" rx="11" ry="13" fill="#c77dff" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="-12" rx="7" ry="9" fill="#c77dff">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-4" y="-2" width="8" height="3" rx="1" fill="#c77dff" opacity="0.9"/>
    <rect x="-3" y="2" width="6" height="2" rx="1" fill="#888" opacity="0.8"/>
    <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="7" fill="#c77dff" opacity="0.9">Yeelight</text>
  </g>

  <!-- LIFX bulb (cyan) -->
  <g transform="translate(208, 110)" filter="url(#glow)">
    <ellipse cx="0" cy="-12" rx="11" ry="13" fill="#4cc9f0" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="-12" rx="7" ry="9" fill="#4cc9f0">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-4" y="-2" width="8" height="3" rx="1" fill="#4cc9f0" opacity="0.9"/>
    <rect x="-3" y="2" width="6" height="2" rx="1" fill="#888" opacity="0.8"/>
    <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="#4cc9f0" opacity="0.9">LIFX</text>
  </g>

  <!-- Kasa bulb (green) -->
  <g transform="translate(278, 110)" filter="url(#glow)">
    <ellipse cx="0" cy="-12" rx="11" ry="13" fill="#52b788" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="-12" rx="7" ry="9" fill="#52b788">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.6s" begin="0.9s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-4" y="-2" width="8" height="3" rx="1" fill="#52b788" opacity="0.9"/>
    <rect x="-3" y="2" width="6" height="2" rx="1" fill="#888" opacity="0.8"/>
    <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="#52b788" opacity="0.9">Kasa</text>
  </g>

  <!-- MagicHome bulb (blue) -->
  <g transform="translate(348, 110)" filter="url(#glow)">
    <ellipse cx="0" cy="-12" rx="11" ry="13" fill="#4895ef" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.7s" begin="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="-12" rx="7" ry="9" fill="#4895ef">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.7s" begin="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-4" y="-2" width="8" height="3" rx="1" fill="#4895ef" opacity="0.9"/>
    <rect x="-3" y="2" width="6" height="2" rx="1" fill="#888" opacity="0.8"/>
    <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#4895ef" opacity="0.9">Magic</text>
  </g>

  <!-- Tuya bulb (red) -->
  <g transform="translate(418, 110)" filter="url(#glow)">
    <ellipse cx="0" cy="-12" rx="11" ry="13" fill="#ef233c" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="2.2s" begin="1.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="-12" rx="7" ry="9" fill="#ef233c">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" begin="1.5s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-4" y="-2" width="8" height="3" rx="1" fill="#ef233c" opacity="0.9"/>
    <rect x="-3" y="2" width="6" height="2" rx="1" fill="#888" opacity="0.8"/>
    <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="#ef233c" opacity="0.9">Tuya</text>
  </g>

  <!-- Divider line -->
  <line x1="460" y1="50" x2="460" y2="170" stroke="#30363d" stroke-width="1"/>

  <!-- ── Right side: title + text ── -->

  <!-- swiss_bulbs title -->
  <text x="560" y="85" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="42" font-weight="bold"
        fill="url(#titleGrad)" filter="url(#glowStrong)" letter-spacing="2">
    swiss_bulbs
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Subtitle -->
  <text x="560" y="112" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="13" fill="#8b949e" letter-spacing="1">
    universal WiFi bulb controller &amp; LAN security scanner
  </text>

  <!-- Protocol list -->
  <text x="480" y="140" font-family="'Courier New', monospace" font-size="11" fill="#30363d">────────────────────────────────────</text>

  <text x="484" y="158" font-family="'Courier New', monospace" font-size="11.5">
    <tspan fill="#f9c74f">WiZ</tspan>
    <tspan fill="#444d56"> · </tspan>
    <tspan fill="#c77dff">Yeelight</tspan>
    <tspan fill="#444d56"> · </tspan>
    <tspan fill="#4cc9f0">LIFX</tspan>
    <tspan fill="#444d56"> · </tspan>
    <tspan fill="#52b788">Kasa</tspan>
    <tspan fill="#444d56"> · </tspan>
    <tspan fill="#4895ef">MagicHome</tspan>
    <tspan fill="#444d56"> · </tspan>
    <tspan fill="#ef233c">Tuya</tspan>
  </text>

  <!-- CVE badge -->
  <rect x="484" y="168" width="120" height="20" rx="4" fill="#1a1f26" stroke="#f9c74f" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="544" y="182" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#f9c74f" opacity="0.9">CVE-2019-18980</text>

  <!-- Author -->
  <text x="620" y="182" font-family="'Courier New', monospace" font-size="10" fill="#444d56">@FR13ND0x7F</text>

  <!-- Animated UDP packet dots travelling left→right between bulbs -->
  <g clip-path="url(#bannerClip)">
    <!-- packet 1 -->
    <circle cx="0" cy="110" r="2" fill="#00ff88" opacity="0.8">
      <animate attributeName="cx" values="68;418" dur="2s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="2s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <!-- packet 2 -->
    <circle cx="0" cy="107" r="1.5" fill="#f9c74f" opacity="0.6">
      <animate attributeName="cx" values="418;68" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.9;1" dur="1.8s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <!-- packet 3 -->
    <circle cx="0" cy="113" r="1.5" fill="#4cc9f0" opacity="0.6">
      <animate attributeName="cx" values="138;348" dur="1.5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.9;1" dur="1.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="858" height="218" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>
  <rect x="1" y="1" width="858" height="218" rx="12" fill="none" stroke="url(#borderGradV)" stroke-width="1.2"/>

  <!-- Corner accents -->
  <line x1="1" y1="30" x2="1" y2="1" stroke="#f9c74f" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="1" y1="1" x2="30" y2="1" stroke="#f9c74f" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="860" y1="30" x2="860" y2="1" stroke="#f9c74f" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="830" y1="1" x2="860" y2="1" stroke="#f9c74f" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="1" y1="190" x2="1" y2="219" stroke="#f9c74f" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="1" y1="219" x2="30" y2="219" stroke="#f9c74f" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="860" y1="190" x2="860" y2="219" stroke="#f9c74f" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="830" y1="219" x2="860" y2="219" stroke="#f9c74f" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
